name: Build academic website

on:
  push:
    paths:
      - 'dist/**'
      - 'templates/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/site.yml'
      - 'papers/**'
      - 'sheets/**'
      - 'assets/**'
      - 'images/**'
      - 'img/**'
      - 'css/**'
      - 'js/**'
      - '*.html'
      - '*.pdf'
  pull_request:
    paths:
      - 'dist/**'
      - 'templates/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/site.yml'
      - 'papers/**'
      - 'sheets/**'
      - 'assets/**'
      - 'images/**'
      - 'img/**'
      - 'css/**'
      - 'js/**'
      - '*.html'
      - '*.pdf'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test content generation
        run: python -m unittest discover -s tests
      - name: Generate entries and section counts
        run: python scripts/render-content.py
      - name: Check generated pages
        run: python scripts/render-content.py --check
      - name: Prepare standalone academic page
        run: python scripts/build-github-pages.py --require-local-links
      - name: Package page
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/github-pages

  deploy:
    if: >-
      vars.PUBLISH_PUBLIC_SITE == 'true' &&
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish approved site
        id: deployment
        uses: actions/deploy-pages@v4
